spring:
  datasource:
    # 仅限本机开发：MySQL 8 的认证可能需要 JDBC 获取服务器公钥。
    # 生产环境必须使用 TLS，并配置受信任的证书，不应复用此连接串。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/online_safe?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  servlet:
    session:
      # 与 application.yml 一致：空闲 1 小时后会话过期，需重新登录
      timeout: 1h
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
