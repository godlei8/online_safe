spring:
  datasource:
    # 仅限本机开发：MySQL 8 的认证可能需要 JDBC 获取服务器公钥。
    # 生产环境必须使用 TLS，并配置受信任的证书，不应复用此连接串。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/online_safe?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  servlet:
    session:
      # 与 application.yml 一致：空闲 1 小时后会话过期，需重新登录
      timeout: 1h
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    org.springframework.security: INFO

app:
  vault:
    # 本地可沿用默认开发密钥；生产必须覆盖 VAULT_ENCRYPTION_KEY
    encryption-key: ${VAULT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    current-key-id: ${VAULT_CURRENT_KEY_ID:1}
  sms:
    # 本地联调阿里云时设 provider: aliyun；不配密钥时用 logging（验证码打日志）
    provider: ${SMS_PROVIDER:logging}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    # 与控制台模板 CODE 一致；模板变量需同时传 code、min
    template-register: ${ALIYUN_SMS_TEMPLATE_REGISTER:}
    template-reset: ${ALIYUN_SMS_TEMPLATE_RESET:}
    code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:300}
  cos:
    # 本地默认可 local；接腾讯云时 provider: tencent 并填密钥
    provider: ${COS_PROVIDER:local}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}
    prefix: ${COS_PREFIX:}
    path-prefix: ${COS_PATH_PREFIX:avatars}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
    local-dir: ${COS_LOCAL_DIR:./data/avatars}
