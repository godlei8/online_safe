spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

app:
  flyway:
    repair-before-migrate: false
  invitation:
    encryption-key: ${INVITATION_ENCRYPTION_KEY}
  vault:
    encryption-key: ${VAULT_ENCRYPTION_KEY}
    current-key-id: ${VAULT_CURRENT_KEY_ID:1}
  sms:
    provider: aliyun
    access-key-id: ${ALIYUN_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET}
    sign-name: ${ALIYUN_SMS_SIGN_NAME}
    template-register: ${ALIYUN_SMS_TEMPLATE_REGISTER}
    template-reset: ${ALIYUN_SMS_TEMPLATE_RESET}
    code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:300}
    code-length: ${SMS_CODE_LENGTH:6}
    send-interval-seconds: ${SMS_SEND_INTERVAL_SECONDS:60}
    send-daily-limit: ${SMS_SEND_DAILY_LIMIT:10}
  cos:
    provider: ${COS_PROVIDER:tencent}
    secret-id: ${COS_SECRET_ID}
    secret-key: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}
    prefix: ${COS_PREFIX:}
    path-prefix: ${COS_PATH_PREFIX:avatars}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
    local-dir: ${COS_LOCAL_DIR:./data/avatars}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
