spring:
  application:
    name: online-safe-backend
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # 实际 migrate 策略见 FlywayConfig：先 repair 再 migrate（适配 MySQL 非事务 DDL）
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 1h
      cookie:
        # 个人端 Cookie 名；管理端为 ONLINE_SAFE_ADMIN_SESSION（见 SurfaceAwareCookieHttpSessionIdResolver）
        name: ONLINE_SAFE_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  flyway:
    # MySQL DDL 提交后无法回滚；启动前 repair 可清理失败记录并重新对齐校验和。
    # 要求迁移脚本可重复执行（IF NOT EXISTS / 条件 DDL）。
    repair-before-migrate: ${FLYWAY_REPAIR_BEFORE_MIGRATE:true}
  invitation:
    # 32 字节 AES 密钥（Base64）。生产环境必须通过 INVITATION_ENCRYPTION_KEY 注入，勿使用默认值。
    encryption-key: ${INVITATION_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  vault:
    # 32 字节 AES 密钥（Base64）。生产环境必须通过 VAULT_ENCRYPTION_KEY 注入。
    # 多钥轮换时可改用 keyring-file（JSON: currentKeyId + keys），见 VaultKeyRing。
    encryption-key: ${VAULT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    current-key-id: ${VAULT_CURRENT_KEY_ID:1}
    keyring-file: ${VAULT_KEYRING_FILE:}
  data-recovery:
    max-items: ${DATA_RECOVERY_MAX_ITEMS:5000}
    max-templates: ${DATA_RECOVERY_MAX_TEMPLATES:500}
    batch-size: ${DATA_RECOVERY_BATCH_SIZE:100}
    max-file-bytes: ${DATA_RECOVERY_MAX_FILE_BYTES:20971520}
  version: ${APP_VERSION:dev}
  sms:
    # provider=aliyun 正式发送；本地未配密钥时自动降级为 logging（日志输出验证码）。
    provider: ${SMS_PROVIDER:aliyun}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-register: ${ALIYUN_SMS_TEMPLATE_REGISTER:}
    template-reset: ${ALIYUN_SMS_TEMPLATE_RESET:}
    code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:300}
    code-length: ${SMS_CODE_LENGTH:6}
    send-interval-seconds: ${SMS_SEND_INTERVAL_SECONDS:60}
    send-daily-limit: ${SMS_SEND_DAILY_LIMIT:10}
  audit:
    fingerprint-key: ${AUDIT_FINGERPRINT_KEY:}
    trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
    failure-aggregate-limit-per-minute: ${AUDIT_FAILURE_AGGREGATE_LIMIT:5}
    purge-batch-size: ${AUDIT_PURGE_BATCH_SIZE:5000}
  cos:
    # provider=tencent 上传腾讯云；local 写本地目录（开发默认）
    provider: ${COS_PROVIDER:local}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}
    prefix: ${COS_PREFIX:}
    path-prefix: ${COS_PATH_PREFIX:avatars}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
    local-dir: ${COS_LOCAL_DIR:./data/avatars}
