spring:
  datasource:
    url: jdbc:h2:mem:online_safe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  session:
    jdbc:
      initialize-schema: always

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  invitation:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  vault:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    current-key-id: 1
  audit:
    fingerprint-key: test-audit-fingerprint-key
    trusted-proxies: ""
    failure-aggregate-limit-per-minute: 5
    purge-batch-size: 100
  sms:
    provider: recording
    code-ttl-seconds: 300
    code-length: 6
    send-interval-seconds: 1
    send-daily-limit: 100
  cos:
    provider: local
    local-dir: ./build/test-avatars
