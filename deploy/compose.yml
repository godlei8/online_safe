name: online-safe

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ../backend
    image: online-safe-backend:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
      INVITATION_ENCRYPTION_KEY: ${INVITATION_ENCRYPTION_KEY}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      VAULT_CURRENT_KEY_ID: ${VAULT_CURRENT_KEY_ID:-1}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME}
      ALIYUN_SMS_TEMPLATE_REGISTER: ${ALIYUN_SMS_TEMPLATE_REGISTER}
      ALIYUN_SMS_TEMPLATE_RESET: ${ALIYUN_SMS_TEMPLATE_RESET}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_CODE_LENGTH: ${SMS_CODE_LENGTH:-6}
      SMS_SEND_INTERVAL_SECONDS: ${SMS_SEND_INTERVAL_SECONDS:-60}
      SMS_SEND_DAILY_LIMIT: ${SMS_SEND_DAILY_LIMIT:-10}
      COS_PROVIDER: ${COS_PROVIDER:-tencent}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_PREFIX: ${COS_PREFIX:-}
      COS_PATH_PREFIX: ${COS_PATH_PREFIX:-avatars}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
      IMPORT_AI_ENABLED: ${IMPORT_AI_ENABLED:-false}
      IMPORT_AI_BASE_URL: ${IMPORT_AI_BASE_URL:-}
      IMPORT_AI_API_KEY: ${IMPORT_AI_API_KEY:-}
      IMPORT_AI_MODEL: ${IMPORT_AI_MODEL:-}
      IMPORT_AI_TIMEOUT: ${IMPORT_AI_TIMEOUT:-60s}
      IMPORT_AI_MAX_RETRIES: ${IMPORT_AI_MAX_RETRIES:-2}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ../frontend
    image: online-safe-frontend:local
    restart: unless-stopped
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - edge
      - internal

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
    internal: true
